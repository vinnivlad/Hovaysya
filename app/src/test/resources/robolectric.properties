# One SDK for every test, set here rather than with `@Config` on each class.
#
# 34 and not 35: Robolectric ships a prebuilt Android for each level, and the
# newest one always lands a release behind the compile SDK. Nothing under test
# here is version-dependent -- the app's own minSdk is 26 -- so the level only
# has to exist.
sdk=34
