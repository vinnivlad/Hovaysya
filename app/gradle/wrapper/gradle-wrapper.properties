# The distribution is pinned here so the version is in git rather than in
# somebody's memory. `gradle-wrapper.jar` is deliberately absent: it is a binary,
# and this repository has never carried one.
#
# IntelliJ and Android Studio read this file and fetch the distribution
# themselves when the project is opened, so nothing needs to be installed. If a
# working `./gradlew` is wanted on the command line, one `gradle wrapper` from
# any Gradle -- including the one Android Studio ships -- writes the jar.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
