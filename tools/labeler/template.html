<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ховайся — розмітка</title>
<style>
  :root {
    --bg: #14181d; --panel: #1c2127; --panel2: #232931; --line: #2f373f;
    --ink: #e8ecef; --soft: #a3aeb9; --faint: #6f7c88;
    --now: #f0a83c; --done: #4fbfae; --near: #f0a83c; --dist: #6f7c88;
    --shelter: #e5484d; --alert: #f0a83c; --info: #5b9dd9; --silent: #6f7c88;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    --sans: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    font-size: 14px; display: grid;
    grid-template-columns: 210px minmax(0,1fr) 330px; grid-template-rows: 46px 1fr;
    grid-template-areas: "head head head" "nights feed form";
  }

  header {
    grid-area: head; display: flex; align-items: center; gap: 18px;
    padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: .01em; }
  header .ref { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  header .grow { flex: 1; }
  header .stat { font-family: var(--mono); font-size: 11.5px; color: var(--soft); }
  header .stat b { color: var(--ink); font-variant-numeric: tabular-nums; }
  button {
    font-family: var(--sans); font-size: 12px; padding: 5px 11px; cursor: pointer;
    background: var(--panel2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 3px;
  }
  button:hover { border-color: var(--faint); }
  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--now); outline-offset: 1px;
  }
  button.primary { background: var(--now); color: #14181d; border-color: var(--now); font-weight: 600; }

  /* nights */
  #nights { grid-area: nights; overflow-y: auto; border-right: 1px solid var(--line);
            background: var(--panel); }
  .night {
    padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer;
    display: flex; flex-direction: column; gap: 3px;
  }
  .night:hover { background: var(--panel2); }
  .night.sel { background: var(--panel2); box-shadow: inset 3px 0 0 var(--now); }
  .night .d { font-family: var(--mono); font-size: 12.5px; }
  .night .c { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
  .night .c .near { color: var(--near); }
  .night .c .lab { color: var(--done); }

  /* feed */
  #feed { grid-area: feed; overflow-y: auto; padding: 0 0 200px; }
  .bar {
    position: sticky; top: 0; z-index: 2; background: var(--bg);
    border-bottom: 1px solid var(--line); padding: 7px 14px;
    display: flex; align-items: center; gap: 12px;
    font-family: var(--mono); font-size: 11px; color: var(--faint);
  }
  .msg {
    display: grid; grid-template-columns: 46px 62px 1fr; gap: 0 10px;
    padding: 7px 14px; border-bottom: 1px solid #1f252b; cursor: pointer;
    border-left: 3px solid transparent;
  }
  .msg:hover { background: #191e24; }
  .msg.sel { background: #1f262e; border-left-color: var(--now); }
  .msg.near { border-left-color: var(--near); }
  .msg.sel.near { border-left-color: var(--now); }
  .msg .tm { font-family: var(--mono); font-size: 11.5px; color: var(--faint); padding-top: 2px; }
  .msg .cn { font-family: var(--mono); font-size: 10.5px; color: var(--faint); padding-top: 3px; }
  .msg .bd { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .msg .tx { white-space: pre-wrap; word-break: break-word; line-height: 1.4; }
  .msg .qt {
    font-size: 12px; color: var(--faint); border-left: 2px solid var(--line);
    padding-left: 7px; white-space: pre-wrap;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .04em;
    text-transform: uppercase; padding: 1px 5px; border-radius: 2px;
    border: 1px solid var(--line); color: var(--faint);
  }
  .tag.scope-my-area, .tag.scope-my-district { color: var(--near); border-color: var(--near); }
  .tag.weak { color: var(--soft); border-style: dashed; }
  .tag.mod-aftermath { color: #c98ad6; border-color: #6a5f8a; }
  .tag.mod-non-threat { color: var(--faint); }
  /* form */
  #form { grid-area: form; overflow-y: auto; border-left: 1px solid var(--line);
          background: var(--panel); padding: 14px; }
  #form h2 { font-size: 12px; margin: 0 0 12px; letter-spacing: .07em;
             text-transform: uppercase; color: var(--soft); }
  .empty { color: var(--faint); font-size: 13px; line-height: 1.6; }
  .row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 11px; }
  .row > label { font-family: var(--mono); font-size: 10px; letter-spacing: .08em;
                 text-transform: uppercase; color: var(--faint); }
  select, input[type=text], textarea {
    background: var(--bg); color: var(--ink); border: 1px solid var(--line);
    border-radius: 3px; padding: 6px 7px; font-family: var(--sans); font-size: 13px;
    width: 100%;
  }
  textarea { resize: vertical; min-height: 52px; line-height: 1.4; }
  .pick { display: flex; flex-wrap: wrap; gap: 6px; }
  .pick button {
    flex: 1 1 auto; min-width: 86px; padding: 8px 10px; font-size: 12.5px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    line-height: 1.25;
  }
  .pick button .sub { font-size: 9.5px; color: var(--faint); letter-spacing: .02em; }
  .pick button.on { background: var(--now); color: #14181d; border-color: var(--now); font-weight: 600; }
  .pick button.on .sub { color: #14181d; opacity: .72; }
  .pick button.on.shelter { background: var(--shelter); border-color: var(--shelter); color: #fff; }
  .pick button.on.shelter .sub { color: #fff; opacity: .8; }
  .pick button.on.info { background: var(--info); border-color: var(--info); color: #14181d; }
  .pick button.on.muted { background: var(--panel2); border-color: var(--soft); color: var(--ink); }
  .pick button.on.muted .sub { color: var(--faint); }
  details.more { margin-top: 6px; }
  details.more summary {
    cursor: pointer; font-family: var(--mono); font-size: 10px; color: var(--faint);
    letter-spacing: .08em; text-transform: uppercase; padding: 2px 0;
  }
  details.more .pick { margin-top: 6px; }
  .auto {
    font-family: var(--mono); font-size: 9px; padding: 1px 4px; border-radius: 2px;
    border: 1px solid var(--line); color: var(--faint); letter-spacing: .04em;
  }
  .auto.manual { color: var(--now); border-color: var(--now); }
  .seg { display: flex; gap: 0; }
  .seg button { flex: 1; border-radius: 0; font-size: 11.5px; padding: 6px 4px; }
  .seg button:first-child { border-radius: 3px 0 0 3px; }
  .seg button:last-child { border-radius: 0 3px 3px 0; }
  .seg button.on { background: var(--now); color: #14181d; border-color: var(--now); font-weight: 600; }
  .seg button.on.shelter { background: var(--shelter); border-color: var(--shelter); color: #fff; }
  .seg button.on.info { background: var(--info); border-color: var(--info); color: #14181d; }
  .ctx {
    background: var(--bg); border: 1px solid var(--line); border-radius: 3px;
    padding: 8px 9px; font-size: 12.5px; margin-bottom: 12px; line-height: 1.4;
  }
  .ctx .t { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .quick {
    align-self: flex-start; margin-top: 2px; padding: 2px 8px;
    font-size: 10.5px; opacity: .45; transition: opacity .1s;
  }
  .msg:hover .quick, .msg.sel .quick { opacity: 1; }
  .quick:hover { border-color: var(--soft); }
  .req {
    font-family: var(--mono); font-size: 9px; color: var(--shelter);
    border: 1px solid var(--shelter); border-radius: 2px; padding: 0 3px;
    letter-spacing: .04em;
  }
  .msg.siren { background: #171d24; }
  .msg.siren-alert { border-left-color: var(--shelter); }
  .msg.siren-clear { border-left-color: var(--done); }
  .msg.siren .tx { font-weight: 600; }
  .tag.siren-tag { font-weight: 600; }
  .tag.siren-tag.alert { color: var(--shelter); border-color: var(--shelter); }
  .tag.siren-tag.clear { color: var(--done); border-color: var(--done); }
  .moment {
    display: flex; align-items: baseline; gap: 10px; cursor: pointer;
    margin: 0 0 0 14px; padding: 5px 10px 5px 8px;
    border-left: 3px solid var(--line); background: #191e24;
    font-size: 12px;
  }
  .moment:hover { background: #1f262e; }
  .moment .mt { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
  .moment .mk { font-family: var(--mono); font-size: 10.5px; font-weight: 600; }
  .moment .mr {
    font-family: var(--mono); font-size: 9px; text-transform: uppercase;
    letter-spacing: .06em; border: 1px solid currentColor; border-radius: 2px;
    padding: 0 4px;
  }
  .moment .mw { color: var(--soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .moment.shelter { border-left-color: var(--shelter); } .moment.shelter .mk, .moment.shelter .mr { color: var(--shelter); }
  .moment.alert   { border-left-color: var(--alert); }   .moment.alert .mk, .moment.alert .mr { color: var(--alert); }
  .moment.info    { border-left-color: var(--info); }    .moment.info .mk, .moment.info .mr { color: var(--info); }
  .moment.silent  { border-left-color: var(--silent); }  .moment.silent .mk { color: var(--silent); }

  .moment-head {
    display: flex; align-items: baseline; gap: 9px; margin-bottom: 10px;
    padding-bottom: 8px; border-bottom: 1px solid var(--line);
    font-size: 11.5px; color: var(--faint);
  }
  .moment-head .mt {
    font-family: var(--mono); font-size: 16px; font-weight: 600; color: var(--now);
  }
  .prev { margin-bottom: 10px; }
  .prev .plabel {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--faint); margin-bottom: 4px;
  }
  .prev .pmsg {
    font-size: 11.5px; color: var(--faint); line-height: 1.35;
    display: flex; gap: 7px; padding: 1px 0;
  }
  .prev .pmsg span { font-family: var(--mono); font-size: 10px; flex: 0 0 auto; }
  .inh {
    background: var(--panel2); border: 1px solid var(--line); border-left: 3px solid var(--info);
    border-radius: 3px; padding: 7px 9px; font-size: 12px; margin-bottom: 11px;
    line-height: 1.4; color: var(--soft);
  }
  .inh b { color: var(--ink); font-family: var(--mono); }
  .warn {
    background: #3b1c1e; border: 1px solid var(--shelter); color: #ffb3b5;
    border-radius: 3px; padding: 7px 9px; font-size: 12px; margin-bottom: 11px;
    line-height: 1.4;
  }
  .actions { display: flex; gap: 7px; margin-top: 4px; }
  .keys {
    margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line);
    font-family: var(--mono); font-size: 10.5px; color: var(--faint); line-height: 1.9;
  }
  .keys b { color: var(--soft); }
</style>
</head>
<body>

<header>
  <h1>Ховайся — розмітка</h1>
  <span class="ref" id="ref"></span>
  <span class="grow"></span>
  <span class="stat" id="stat"></span>
  <button id="exportBtn" class="primary">Експорт JSONL</button>
</header>

<div id="nights"></div>

<div id="feed">
  <div class="bar">
    <span id="filterLabel"></span>
    <span class="grow" style="flex:1"></span>
    <span id="nightStat"></span>
  </div>
  <div id="rows"></div>
</div>

<div id="form">
  <h2>Момент</h2>
  <div id="formBody"></div>
  <div class="keys">
    <b>j / k</b> — рух по фіду<br>
    <b>n</b> — буди &nbsp; <b>s</b> — молчи<br>
    <b>1 2 3</b> — info / alert / shelter<br>
    <b>Enter</b> — зберегти &nbsp; <b>Esc</b> — скасувати<br>
    <b>x</b> — видалити мітку<br>
    <b>f</b> — фільтр &nbsp; <b>[ ]</b> — ніч
  </div>
</div>

<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
"use strict";

const DATA = JSON.parse(document.getElementById("payload").textContent);
const STORE_KEY = "hovaysya-labels-v1";

// Three reasons a message stays visible however little geography it names:
//   m.nw  country-wide threats — a MiG-31K takeoff names a Russian airfield
//   m.as  siren declarations and all-clears — the frame of the whole night;
//         without them there is no telling when a threat passed
//   scope the ordinary geographic test
// Alert-state messages are shown unless they clearly belong to another region.
const LOCAL = ["my-area", "my-district", "city", "oblast"];
const frame = m => m.as && m.s !== "elsewhere";
const FILTERS = [
  { id: "near",     name: "поруч зі мною + країна + тривоги",
    test: m => m.nw || frame(m) || m.s === "my-area" || m.s === "my-district" },
  { id: "relevant", name: "Київ, область + країна + тривоги",
    test: m => m.nw || frame(m) || LOCAL.includes(m.s) },
  { id: "all",      name: "усе", test: () => true },
];

const LEVELS = ["info", "alert", "shelter"];
const ALARMS = ["alert", "ballistic", "mig", "cruise", "drone-jet", "drone",
                "recon", "clear", "none"];
const SILENT_REASONS = ["too-far", "already-notified", "resolved", "insufficient"];
// Five primary types, ordered by how urgently they need a reaction, one sound
// each. The rest sit behind a secondary row so the common case stays one row.
// The two "no type stated" cases come first, because they are the most common
// and because confusing them is the easiest mistake to make: `none` means
// nothing is flying, `unknown` means something is and nobody said what — which
// is what a bare "Тривога" is. The rest follow, ordered by how little time each
// leaves.
const THREATS_MAIN = ["none", "unknown", "recon", "mig", "shahed", "shahed-jet",
                      "cruise", "ballistic"];
const THREATS_MORE = ["kab", "aviation", "mixed"];
const MODALITIES = ["live-threat", "aftermath", "summary-news", "non-threat"];
const SCOPES = ["my-area", "my-district", "city", "oblast", "elsewhere", "unknown"];
const CERTAINTIES = ["confirmed", "probable", "lost", "clear"];

const ALARM_FOR = {
  recon: "recon", mig: "mig", shahed: "drone", "shahed-jet": "drone-jet",
  cruise: "cruise", ballistic: "ballistic", kab: "cruise",
  aviation: "none", mixed: "ballistic", unknown: "drone", none: "none",
};

// Ukrainian labels for clicking; stored values stay the schema's enums.
const UA = {
  decision: { notify: "буди", silent: "не буди" },
  level: { info: "тихо", alert: "звук", shelter: "гучно, в укриття" },
  levelHint: {
    info: "тільки статус", alert: "розбудити раз",
    shelter: "повторно, весь екран",
  },
  threat: {
    recon: "розвідник", mig: "МіГ-31К", shahed: "дрон",
    "shahed-jet": "реактивний дрон", cruise: "ракета", ballistic: "балістика",
    kab: "КАБ", aviation: "інша авіація", mixed: "змішано",
    unknown: "невідомо", none: "нічого",
  },
  threatHint: {
    none: "нічого не летить", unknown: "летить, але що — не сказано",
    recon: "не шкодить",
    mig: "тривога на всю країну", shahed: "хвилини",
    "shahed-jet": "мало хвилин", cruise: "хвилини", ballistic: "часу немає",
    aviation: "задовго до тривоги",
  },
  alarm: {
    ballistic: "балістика", mig: "МіГ", cruise: "ракета",
    "drone-jet": "реактивний", drone: "дрон", recon: "розвідник",
    alert: "тривога", clear: "відбій", aviation: "—", none: "без звуку",
  },
  silent_reason: {
    "too-far": "далеко від мене", "already-notified": "вже будив",
    resolved: "відбій", insufficient: "ще рано",
  },
  modality: {
    "live-threat": "жива загроза", aftermath: "наслідки",
    "summary-news": "зведення", "non-threat": "не загроза",
  },
  scope: {
    "my-area": "моя зона", "my-district": "мій район", city: "місто",
    oblast: "область", elsewhere: "інде", unknown: "невідомо",
  },
  certainty: {
    confirmed: "підтверджено", probable: "ймовірно",
    lost: "втрачено з виду", clear: "чисто",
  },
};

let labels = loadLabels();
let nightId = DATA.nights.length ? DATA.nights[0].id : null;
let filterIx = 0;
let selIx = -1;
let draft = null;

function loadLabels() {
  try {
    const cached = localStorage.getItem(STORE_KEY);
    if (cached) {
      const parsed = JSON.parse(cached);
      if (Array.isArray(parsed) && parsed.length >= DATA.labels.length) return parsed;
    }
  } catch (e) { /* private mode, cleared storage — fall through */ }
  return DATA.labels.slice();
}

function persist() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(labels)); } catch (e) {}
}

function nightMessages() {
  return DATA.messages.filter(m => m.n === nightId);
}
function visibleMessages() {
  const f = FILTERS[filterIx].test;
  return nightMessages().filter(f);
}
function labelsForNight() {
  return labels.filter(l => l.night === nightId)
               .sort((a, b) => a.at.localeCompare(b.at));
}
function labelForMessage(m) {
  return labels.find(l => l.anchor === m.k);
}

function nextLabelId(m) {
  const stamp = m.hm.replace(":", "");
  const base = `${nightId}T${m.hm}`;
  let n = 1;
  while (labels.some(l => l.id === `${base}-${String(n).padStart(2, "0")}`)) n++;
  return `${base}-${String(n).padStart(2, "0")}`;
}

/* ---------- rendering ---------- */

function renderNights() {
  const el = document.getElementById("nights");
  el.innerHTML = "";
  for (const n of DATA.nights) {
    const count = labels.filter(l => l.night === n.id).length;
    const d = document.createElement("div");
    d.className = "night" + (n.id === nightId ? " sel" : "");
    d.innerHTML =
      `<span class="d">${n.id}</span>` +
      `<span class="c">${n.count} · <span class="near">${n.near} поруч</span>` +
      (count ? ` · <span class="lab">${count} мітк.</span>` : "") + `</span>`;
    d.onclick = () => { nightId = n.id; selIx = -1; draft = null; renderAll(); };
    el.appendChild(d);
  }
}

function tag(text, cls) {
  return `<span class="tag ${cls || ""}">${esc(text)}</span>`;
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function renderFeed() {
  const rows = document.getElementById("rows");
  rows.innerHTML = "";
  const msgs = visibleMessages();
  document.getElementById("filterLabel").textContent = "фільтр: " + FILTERS[filterIx].name;
  document.getElementById("nightStat").textContent =
    `${msgs.length} з ${nightMessages().length} · ${labelsForNight().length} міток`;

  msgs.forEach((m, ix) => {
    const near = m.s === "my-area" || m.s === "my-district";
    const lab = labelForMessage(m);
    const div = document.createElement("div");
    div.className = "msg" + (near ? " near" : "") + (ix === selIx ? " sel" : "") +
      (m.as ? " siren siren-" + m.as : "");
    div.dataset.ix = ix;

    let tags = m.as ? tag(m.as === "clear" ? "відбій" : "тривога", "siren-tag " + m.as) : "";
    tags += tag(m.s, "scope-" + m.s);
    if (m.m !== "live-threat") tags += tag(m.m, "mod-" + m.m);
    if (m.th !== "none") tags += tag(m.th);
    if (m.st === "weak") tags += tag("weak", "weak");
    if (m.ce !== "confirmed") tags += tag(m.ce);
    if (m.inf.length) tags += tag(m.inf.join("/"));

    div.innerHTML =
      `<div class="tm">${esc(m.hm)}</div><div class="cn">${esc(m.c)}</div>` +
      `<div class="bd">` +
        (m.q ? `<div class="qt">↳ ${esc(m.q)}</div>` : "") +
        `<div class="tx">${esc(m.x)}</div>` +
        `<div class="tags">${tags}</div>` +
      `</div>`;
    div.onclick = () => { selIx = ix; openDraft(); renderAll(); };

    if (!lab) {
      const quick = document.createElement("button");
      quick.type = "button";
      quick.className = "quick";
      quick.textContent = "не буди";
      quick.title = "зберегти «не буди» з тими ж налаштуваннями, що попереднє";
      quick.onclick = ev => {
        ev.stopPropagation();
        selIx = ix;
        openDraft("silent");
        save();
      };
      div.querySelector(".bd").appendChild(quick);
    }

    rows.appendChild(div);

    // The label is a mark on the timeline placed just after this message
    // arrived — not a property of the message. Rendering it as a full-width
    // bar between rows is the whole point: a badge inside the row reads as
    // "this post is judged", which is the misreading to avoid.
    if (lab) {
      const bar = document.createElement("div");
      const kind = lab.decision === "silent" ? "silent" : lab.level;
      bar.className = "moment " + kind;
      bar.innerHTML =
        `<span class="mt">${esc(m.hm)}</span>` +
        `<span class="mk">${lab.decision === "silent"
            ? "молчати · " + esc(UA.silent_reason[lab.silent_reason] || lab.silent_reason)
            : esc(UA.level[lab.level] || lab.level) + " · " + esc(UA.alarm[lab.alarm] || lab.alarm)}` +
        `</span>` +
        (lab.repeat_of ? `<span class="mr">повтор</span>` : "") +
        `<span class="mw">${esc(lab.why)}</span>`;
      bar.onclick = () => { selIx = ix; openDraft(); renderAll(); };
      rows.appendChild(bar);
    }
  });
}

function selected() {
  const msgs = visibleMessages();
  return selIx >= 0 && selIx < msgs.length ? msgs[selIx] : null;
}

// Labelling every post is a supported way to work — it is denser and better
// data, and the hard part is deciding which moments matter, not clicking. So a
// new draft starts from the night's most recent label of the same decision:
// a run of "молчати · вже будив" is then one click each.
function lastLabelLike(decision) {
  const same = labelsForNight().filter(l => l.decision === decision);
  return same.length ? same[same.length - 1] : null;
}

function openDraft(decision) {
  const m = selected();
  if (!m) return;
  const existing = labelForMessage(m);
  if (existing && !decision) { draft = Object.assign({}, existing); return; }
  const prev = lastLabelLike(decision || "notify");
  draft = existing ? Object.assign({}, existing) : {
    id: nextLabelId(m),
    night: nightId,
    anchor: m.k,
    at: new Date(m.t * 1000).toISOString().replace(/\.\d+Z$/, "Z"),
    decision: "notify",
    level: m.as ? "alert" : (prev && prev.level ? prev.level : "alert"),
    alarm: m.as === "clear" ? "clear"
         : m.as === "alert" ? "alert"
         : (m.al === "none" ? "drone" : m.al),
    // Sticky, except where the region says otherwise. Carrying
    // "already-notified" onto another region's target produced ~20 mislabels
    // in the first real night.
    silent_reason: m.s === "elsewhere" ? "too-far"
                 : (prev && prev.silent_reason ? prev.silent_reason
                                               : "already-notified"),
    // A moment is judged in context, so a message stating no type or place
    // inherits the last one the feed gave. Judging posts in isolation is the
    // mistake the schema opens by warning about.
    threat: (m.th === "none" || m.th === "unknown") && m.ith ? m.ith
          : (m.th === "none" ? "unknown" : m.th),
    modality: m.m,
    scope: m.s === "unknown" && m.isc ? m.isc : m.s,
    certainty: m.ce,
    repeat_of: null,
    evidence: [{ channel: m.ch, message_id: m.id }],
    why: "",
    open_question: "",
  };
  if (decision) draft.decision = decision;
}

function pick(field, values, cur, opts) {
  opts = opts || {};
  const labels = opts.labels || UA[field] || {};
  const subs = opts.subs || {};
  return `<div class="pick">` + values.map(v => {
    const on = v === cur;
    const cls = [on ? "on" : "", on && opts.tone ? opts.tone(v) : ""].join(" ").trim();
    const sub = subs[v] ? `<span class="sub">${esc(subs[v])}</span>` : "";
    return `<button type="button" data-f="${field}" data-v="${esc(v)}" class="${cls}">` +
           `${esc(labels[v] || v)}${sub}</button>`;
  }).join("") + `</div>`;
}

function renderForm() {
  const body = document.getElementById("formBody");
  const m = selected();
  if (!m || !draft) {
    body.innerHTML = `<div class="empty">Клікни повідомлення у фіді.<br><br>
      Ти оцінюєш не текст поста, а <b>мить, коли він прийшов</b>: чи мусив
      застосунок розбудити тебе саме тоді, знаючи все, що фід сказав до
      цього.<br><br>
      Тому повідомлення тут — тригер і контекст, а не предмет оцінки.</div>`;
    return;
  }

  const earlier = labelsForNight()
    .filter(l => l.id !== draft.id && l.decision === "notify" && l.at < draft.at);
  const weakShelter = draft.decision === "notify" && draft.level === "shelter" && m.st === "weak";
  const before = visibleMessages().slice(Math.max(0, selIx - 3), selIx);
  let html =
    `<div class="moment-head"><span class="mt">${esc(m.hm)}</span>` +
    `<span>момент одразу після цього повідомлення</span></div>`;
  if (before.length) {
    html += `<div class="prev"><div class="plabel">що було видно до цього</div>` +
      before.map(b => `<div class="pmsg"><span>${esc(b.hm)}</span>` +
        `${esc(b.x.replace(/\n/g, " / ").slice(0, 90))}</div>`).join("") + `</div>`;
  }
  html += `<div class="ctx"><span class="t">${esc(m.hm)} · ${esc(m.c)} · #${m.id}</span><br>${esc(m.x)}</div>`;

  if ((m.ith || m.isc) && m.ifrom) {
    const parts = [];
    if (m.ith) parts.push(`${UA.threat[m.ith] || m.ith}`);
    if (m.isc) parts.push(`${UA.scope[m.isc] || m.isc}`);
    html += `<div class="inh">Саме повідомлення типу й місця не називає —
      підставлено з фіду о <b>${esc(m.ifrom)}</b>: ${esc(parts.join(", "))}.
      Перевір, чи це ще актуально.</div>`;
  }

  if (weakShelter) {
    html += `<div class="warn">Єдина ознака тут — емодзі, а це слабкий сигнал:
      ⚠️ стоїть на 26% усіх повідомлень. <b>Гучно</b> на такому — це майбутнє
      хибне пробудження. Перевір, чи є в тексті щось конкретніше.</div>`;
  }

  if (!m.as && m.ce === "probable" && m.th !== "none") {
    html += `<div class="inh">Це <b>попередження</b>, не подія — загроза пуску,
      а не пуск. Статус оновити варто, але новий звук тут переграє тривогу
      даремно: він потрібен, коли пуск підтвердиться.</div>`;
  }
  if (m.as) {
    html += `<div class="inh">Це <b>${m.as === "clear" ? "відбій" : "оголошення тривоги"}</b> —
      сирена, а не окрема ціль. Обидва мають звучати: на оголошення бо треба
      реагувати, на відбій бо треба знати, що можна виходити.</div>`;
  }
  html += `<div class="row"><label>рішення</label>` +
    pick("decision", ["notify", "silent"], draft.decision,
         { tone: v => v === "silent" ? "muted" : "" }) + `</div>`;

  if (draft.decision === "notify") {
    html += `<div class="row"><label>наскільки настійливо</label>` +
      pick("level", LEVELS, draft.level, { subs: UA.levelHint, tone: v => v }) + `</div>`;
  } else {
    html += `<div class="row"><label>чому молчимо</label>` +
      pick("silent_reason", SILENT_REASONS, draft.silent_reason) + `</div>`;
  }

  // The episode link belongs on silent labels too — arguably more than on
  // notify ones, since "вже будив" is a statement *about* an episode. Hiding it
  // here left repeat_of empty across an entire night of real labelling.
  const episodeRelevant = draft.decision === "notify" ||
                          draft.silent_reason === "already-notified" ||
                          draft.silent_reason === "resolved";
  if (episodeRelevant) {
    html += `<div class="row"><label>${draft.decision === "notify"
        ? "чи це повтор епізоду" : "якого епізоду це стосується"}</label><div class="pick">` +
      `<button type="button" data-f="repeat_of" data-v="" class="${draft.repeat_of ? "" : "on"}">` +
      `${draft.decision === "notify" ? "перший сигнал" : "не знаю"}</button>` +
      earlier.map(l => `<button type="button" data-f="repeat_of" data-v="${esc(l.id)}" ` +
        `class="${draft.repeat_of === l.id ? "on" : ""}">${esc(l.id.slice(11))}` +
        `<span class="sub">${esc(UA.alarm[l.alarm] || l.alarm)}</span></button>`).join("") +
      `</div></div>`;
  }

  const showMore = THREATS_MORE.indexOf(draft.threat) >= 0;
  html += `<div class="row"><label>що летить</label>` +
    pick("threat", THREATS_MAIN, draft.threat, { subs: UA.threatHint }) +
    `<details class="more"${showMore ? " open" : ""}><summary>інше</summary>` +
    pick("threat", THREATS_MORE, draft.threat) + `</details></div>`;

  if (draft.decision === "notify") {
    const auto = m.as ? (m.as === "clear" ? "clear" : "alert")
                      : (ALARM_FOR[draft.threat] || "drone");
    html += `<div class="row"><label>звук ` +
      (draft.alarm === auto ? `<span class="auto">за типом</span>`
                            : `<span class="auto manual">вручну</span>`) +
      `</label>` + pick("alarm", ALARMS, draft.alarm) + `</div>`;

  }

  html += `<div class="row"><label>модальність</label>` +
    pick("modality", MODALITIES, draft.modality,
         { tone: v => v === "aftermath" ? "muted" : "" }) + `</div>`;
  html += `<div class="row"><label>наскільки близько</label>` +
    pick("scope", SCOPES, draft.scope) + `</div>`;
  html += `<div class="row"><label>певність</label>` +
    pick("certainty", CERTAINTIES, draft.certainty) + `</div>`;

  html += `<div class="row"><label>чому — своїми словами` +
    (draft.decision === "notify" ? ` <span class="req">обов'язково</span>` : "") +
    `</label>` +
    `<textarea data-f="why" placeholder="одна фраза">${esc(draft.why)}</textarea></div>`;
  html += `<div class="row"><label>сумнів (не обов'язково)</label>` +
    `<input type="text" data-f="open_question" value="${esc(draft.open_question)}"></div>`;
  html += `<div class="actions"><button type="button" class="primary" id="saveBtn">Зберегти</button>` +
    `<button type="button" id="cancelBtn">Скасувати</button>` +
    (labelForMessage(m) ? `<button type="button" id="delBtn">Видалити</button>` : "") + `</div>`;

  body.innerHTML = html;

  body.querySelectorAll("button[data-f]").forEach(b => {
    b.onclick = () => {
      const f = b.dataset.f;
      const v = b.dataset.v;
      draft[f] = (f === "repeat_of" && v === "") ? null : v;
      // Sound follows the type until it is set by hand.
      if (f === "threat" && !draft._alarmManual && !m.as) {
        draft.alarm = ALARM_FOR[v] || "drone";
      }
      if (f === "alarm") draft._alarmManual = true;
      // "вже будив" is a claim about an episode, so point it at the most
      // recent wake-up unless one was chosen by hand.
      if (f === "silent_reason" && v === "already-notified" && !draft.repeat_of) {
        const last = earlier.length ? earlier[earlier.length - 1] : null;
        if (last) draft.repeat_of = last.id;
      }
      renderForm();
    };
  });
  body.querySelectorAll("textarea[data-f], input[data-f]").forEach(el => {
    el.oninput = () => { draft[el.dataset.f] = el.value; };
  });
  document.getElementById("saveBtn").onclick = () => save(true);
  document.getElementById("cancelBtn").onclick = () => { draft = null; renderAll(); };
  const delBtn = document.getElementById("delBtn");
  if (delBtn) delBtn.onclick = remove;
}

function save(advance) {
  if (!draft) return;
  // A wake-up decision has to be justified; "nothing here" does not. Requiring
  // a sentence on every silent label would make labelling a whole night
  // unbearable, and most of a night is silent.
  if (draft.decision === "notify" && !draft.why.trim()) {
    const ta = document.querySelector("textarea[data-f=why]");
    if (ta) { ta.focus(); ta.style.borderColor = "var(--shelter)"; }
    return;
  }
  const out = Object.assign({}, draft);
  delete out._alarmManual;  // UI state, not data
  if (out.decision === "notify") delete out.silent_reason;
  else { delete out.level; delete out.alarm; }  // repeat_of is kept: see above
  if (!out.open_question) out.open_question = null;

  const ix = labels.findIndex(l => l.id === out.id);
  if (ix >= 0) labels[ix] = out; else labels.push(out);
  persist();
  draft = null;
  const msgs = visibleMessages();
  if (advance && selIx < msgs.length - 1) selIx++;
  openDraft();
  renderAll();
}

function remove() {
  const m = selected();
  if (!m) return;
  const lab = labelForMessage(m);
  if (!lab) return;
  labels = labels.filter(l => l.id !== lab.id);
  persist();
  draft = null;
  renderAll();
}

function renderAll() {
  renderNights();
  renderFeed();
  renderForm();
  document.getElementById("stat").innerHTML =
    `<b>${labels.length}</b> міток · <b>${labels.filter(l => l.decision === "notify").length}</b> буди · ` +
    `<b>${labels.filter(l => l.decision === "silent").length}</b> молчи`;
  const row = document.querySelector(".msg.sel");
  if (row) row.scrollIntoView({ block: "nearest" });
}

/* ---------- export ---------- */

document.getElementById("exportBtn").onclick = () => {
  const ordered = labels.slice().sort((a, b) => a.at.localeCompare(b.at));
  const body = ordered.map(l => JSON.stringify(l)).join("\n") + "\n";
  const url = URL.createObjectURL(new Blob([body], { type: "application/x-ndjson" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = "moments.jsonl";
  a.click();
  URL.revokeObjectURL(url);
};

/* ---------- keyboard ---------- */

document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (typing && e.key !== "Escape" && !(e.key === "Enter" && e.ctrlKey)) return;

  const msgs = visibleMessages();
  switch (e.key) {
    case "j": case "ArrowDown":
      selIx = Math.min(msgs.length - 1, selIx + 1); openDraft(); renderAll(); e.preventDefault(); break;
    case "k": case "ArrowUp":
      selIx = Math.max(0, selIx - 1); openDraft(); renderAll(); e.preventDefault(); break;
    case "n": if (selected()) { openDraft("notify"); renderForm(); } break;
    case "s": if (selected()) { openDraft("silent"); renderForm(); } break;
    case "1": case "2": case "3":
      if (draft && draft.decision === "notify") {
        draft.level = LEVELS[Number(e.key) - 1]; renderForm();
      }
      break;
    case "x": remove(); break;
    case "f": filterIx = (filterIx + 1) % FILTERS.length; selIx = -1; draft = null; renderAll(); break;
    case "[": case "]": {
      const i = DATA.nights.findIndex(n => n.id === nightId);
      const j = e.key === "]" ? i + 1 : i - 1;
      if (j >= 0 && j < DATA.nights.length) {
        nightId = DATA.nights[j].id; selIx = -1; draft = null; renderAll();
      }
      break;
    }
    case "Enter": if (draft) { save(true); e.preventDefault(); } break;
    case "Escape": draft = null; document.activeElement.blur(); renderAll(); break;
  }
});

document.getElementById("ref").textContent =
  `точка відліку: ${DATA.reference} · ${DATA.messages.length} повідомлень · ${DATA.nights.length} ночей`;
renderAll();
</script>
</body>
</html>
